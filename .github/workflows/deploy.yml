name: EpicBook CI/CD

on:
  push:
    branches:
      - capstone/theepicbook-docker
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'proxy/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:

  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build -t $ECR_REGISTRY/epicbook/backend:${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/epicbook/backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/epicbook/frontend:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/epicbook/frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml proxy/nginx.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/theepicbook/

      - name: Deploy on EC2
        run: |
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "ECR_REGISTRY='${{ secrets.ECR_REGISTRY }}' AWS_REGION='${{ secrets.AWS_REGION }}' IMAGE_TAG='${{ github.sha }}' bash -s" << 'REMOTE'
          set -e
          cd ~/theepicbook

          # Point compose at the new ECR images
          sed -i "s|image: epicbook-backend:1.0|image: $ECR_REGISTRY/epicbook/backend:$IMAGE_TAG|" docker-compose.yml
          sed -i "s|image: epicbook-frontend:1.0|image: $ECR_REGISTRY/epicbook/frontend:$IMAGE_TAG|" docker-compose.yml

          # Auth to ECR (VM has the EC2-ECR-Pull-Role attached)
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # Pull the new images and restart
          docker pull "$ECR_REGISTRY/epicbook/backend:$IMAGE_TAG"
          docker pull "$ECR_REGISTRY/epicbook/frontend:$IMAGE_TAG"
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Curl /health
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment verification failed: /health returned $STATUS"
            exit 1
          fi
          echo "===== Deployment Verification Summary ====="
          echo "Image tag deployed : ${{ github.sha }}"
          echo "Public URL          : http://${{ secrets.EC2_HOST }}/"
          echo "Health check        : $STATUS OK"
          echo "============================================="
